# jobroute allowlist: the one config file for the Hermes -> ovh job route.
# Installed at /home/ubuntu/.config/jobroute/allowlist.toml (owner ubuntu, mode 644; the
# route refuses to run if it is group- or world-writable). A profile that is not listed
# here is refused even when its key is in authorized_keys.

[route]
state_dir = "/home/ubuntu/.local/state/jobroute"     # audit.jsonl + profiles/<profile>.jsonl
sb_codejob = "/home/ubuntu/sb/bin/sb-codejob"
job_root = "/home/ubuntu/work"                       # sb-codejob WORKROOT: <job_root>/<agent>/<job>.json
path = "/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin"
max_brief_bytes = 65536

# Fixed engines. The caller picks a name, never a command line; the brief arrives on stdin.
[engines]
claude = ["claude", "-p"]
codex = ["codex", "exec", "--skip-git-repo-check", "-m", "gpt-6.1-sol", "-"]

[defaults]
engines = ["claude", "codex"]
max_per_hour = 4       # accepted submissions in the last 60 min
max_per_day = 20       # accepted submissions in the last 24 h
max_running = 2        # this profile's route jobs still running

# The 12 profiles whose SOUL mentions launching jobs (sshovh-report.md).
# agent = the sb-codejob --agent name (its wake route); workdirs = where a job may start.
[profiles.grok-achilles]
agent = "Achilles"
workdirs = ["/home/ubuntu/work/Achilles"]

[profiles.grok-admin]
agent = "Admin"
workdirs = ["/home/ubuntu/work/Admin"]

[profiles.grok-boppy]
agent = "Boppy"
workdirs = ["/home/ubuntu/work/Boppy"]

[profiles.grok-botsilo]
agent = "Botsilo"
workdirs = ["/home/ubuntu/work/Botsilo"]

[profiles.grok-dmt]
agent = "DMT"
workdirs = ["/home/ubuntu/work/DMT"]

[profiles.grok-doc]
agent = "Doc"
workdirs = ["/home/ubuntu/work/Doc"]

[profiles.grok-finance-controller]
agent = "finance-controller"
workdirs = ["/home/ubuntu/work/finance-controller"]

[profiles.grok-infra]
agent = "Infra Caretaker"
workdirs = ["/home/ubuntu/work/Infra Caretaker"]

[profiles.grok-plainsay]
agent = "Plainsay"
workdirs = ["/home/ubuntu/work/Plainsay"]

[profiles.grok-rapper]
agent = "Rapper"
workdirs = ["/home/ubuntu/work/Rapper"]

[profiles.grok-saldora]
