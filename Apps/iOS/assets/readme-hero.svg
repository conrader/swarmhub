<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SwarmHub for iOS — your agents, wherever you are</title>
  <desc id="description">SwarmHub's agent mark beside a native iPhone app introduction. SwiftUI, iOS 18 or later, in development.</desc>
