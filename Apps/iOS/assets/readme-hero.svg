    <clipPath id="bounds"><rect width="1280" height="430" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="430" fill="url(#canvas)"/>

    <g stroke="#688554" stroke-opacity=".12"><circle cx="1060" cy="195" r="156"/><circle cx="1060" cy="195" r="189" stroke-dasharray="3 9"/></g>
