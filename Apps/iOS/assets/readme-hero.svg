      <text x="56" y="75" fill="#F3F6FA" font-size="30" font-weight="600" letter-spacing="-.8">SwarmHub for iOS</text>
      <text x="52" y="182" fill="#F5F8FC" font-size="66" font-weight="650" letter-spacing="-2.7">Your agents.</text>
      <text x="52" y="259" fill="url(#accent)" font-size="66" font-weight="650" letter-spacing="-2.7">Wherever you are.</text>
      <text x="56" y="307" fill="#BCCCDD" font-size="22">Conversations, sessions and approvals on iPhone.</text>
      <path d="M56 358H1224" stroke="#D0DFEF" stroke-opacity=".16"/>
      <circle cx="60" cy="391" r="4" fill="#98C7FF"/><text x="76" y="396" fill="#D4DFEA" font-size="14">Native SwiftUI</text>
      <circle cx="249" cy="391" r="4" fill="#A2E4CF"/><text x="265" y="396" fill="#D4DFEA" font-size="14">iOS 18+</text>
