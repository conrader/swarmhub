<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SwarmHub — your agents, all together</title>
  <desc id="description">A compact dark blue banner with the SwarmHub wordmark, macOS, Windows, and Linux platform labels, and the website's round two-eye SwarmHub logo below the headline.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="720" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f7f2"/><stop offset="0.55" stop-color="#f7f7f2"/><stop offset="1" stop-color="#f7f7f2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(360 540) scale(350 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#688554" stop-opacity="0.2"/><stop offset="1" stop-color="#688554" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e75a32"/><stop offset="1" stop-color="#e75a32"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="720" height="760" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="720" height="760" fill="url(#canvas)"/>
    <rect width="720" height="760" fill="url(#halo)"/>
    <g stroke="#688554" stroke-opacity="0.12">
      <ellipse cx="360" cy="527" rx="220" ry="166" transform="rotate(-18 360 527)"/>
      <ellipse cx="360" cy="527" rx="253" ry="191" transform="rotate(-18 360 527)" stroke-dasharray="3 9"/>
    </g>
    <circle cx="152" cy="620" r="5" fill="#89D9B8"/>
    <circle cx="561" cy="416" r="4" fill="#688554"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <svg x="36" y="32" width="44" height="44" viewBox="0 0 30 30">
  <title>SwarmHub</title>
  <g transform="rotate(-9 15 15)">
    <circle cx="15" cy="15" r="15" fill="#262821"/>
    <g fill="#f7f7f2">
      <rect x="8.5" y="10" width="4" height="10" rx="2"/>
      <rect x="17.5" y="10" width="4" height="10" rx="2"/>
    </g>
  </g>
</svg>
      <text x="96" y="65" fill="#262821" font-size="26" font-weight="750" letter-spacing="-1">SwarmHub</text>
      <rect x="549" y="56" width="123" height="33" rx="16.5" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="610.5" y="78" text-anchor="middle" fill="#6e7166" font-size="13" font-weight="600" letter-spacing="1.4">PROTOTYPE</text>
      <text x="45" y="181" fill="#262821" font-size="66" font-weight="650" letter-spacing="-2.6">Your agents.</text>
      <text x="45" y="259" fill="url(#accent)" font-size="66" font-weight="650" letter-spacing="-2.6">All together.</text>
      <text x="48" y="308" fill="#6e7166" font-size="26">A desktop workspace</text>
      <text x="48" y="343" fill="#6e7166" font-size="26">for your own agents.</text>
      <path d="M48 703H672" stroke="#688554" stroke-opacity="0.15"/>
      <text x="48" y="737" fill="#6e7166" font-size="16">macOS · Windows · Linux</text>
      <text x="672" y="737" text-anchor="end" fill="#6e7166" font-size="14" letter-spacing="0.8">YOUR WORKSPACE</text>
    </g>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" x="175" y="344" width="370" height="370">
  <title>SwarmHub app icon</title>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#f7f7f2"/>
  <svg x="184" y="184" width="656" height="656" viewBox="0 0 30 30">
    <title>SwarmHub</title>
  <g transform="rotate(-9 15 15)">
    <circle cx="15" cy="15" r="15" fill="#262821"/>
    <g fill="#f7f7f2">
      <rect x="8.5" y="10" width="4" height="10" rx="2"/>
      <rect x="17.5" y="10" width="4" height="10" rx="2"/>
    </g>
  </g>
  </svg>
</svg>
  </g>
</svg>
