<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SwarmHub — your agents, one place to work</title>
  <desc id="description">A compact dark blue banner with the SwarmHub wordmark, macOS, Windows, and Linux platform labels, and the project's colorful SwarmHub bot marks below the headline.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="720" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1727"/><stop offset="0.55" stop-color="#101C30"/><stop offset="1" stop-color="#112A35"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(360 540) scale(350 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C9BBB" stop-opacity="0.2"/><stop offset="1" stop-color="#4C9BBB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FC6FF"/><stop offset="1" stop-color="#A0EACB"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="720" height="760" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="720" height="760" fill="url(#canvas)"/>
    <rect width="720" height="760" fill="url(#halo)"/>
    <g stroke="#A0CFDE" stroke-opacity="0.12">
      <ellipse cx="360" cy="527" rx="220" ry="166" transform="rotate(-18 360 527)"/>
      <ellipse cx="360" cy="527" rx="253" ry="191" transform="rotate(-18 360 527)" stroke-dasharray="3 9"/>
    </g>
    <circle cx="152" cy="620" r="5" fill="#89D9B8"/>
    <circle cx="561" cy="416" r="4" fill="#F2B86E"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="48" y="83" fill="#F3F6FA" font-size="30" font-weight="650" letter-spacing="-0.8">SwarmHub</text>
      <rect x="549" y="56" width="123" height="33" rx="16.5" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="610.5" y="78" text-anchor="middle" fill="#BECCDC" font-size="13" font-weight="600" letter-spacing="1.4">PROTOTYPE</text>
      <text x="45" y="181" fill="#F5F8FC" font-size="66" font-weight="650" letter-spacing="-2.6">Your agents.</text>
      <text x="45" y="259" fill="url(#accent)" font-size="66" font-weight="650" letter-spacing="-2.6">One place to work.</text>
      <text x="48" y="308" fill="#BBCADC" font-size="26">A desktop workspace</text>
      <text x="48" y="343" fill="#BBCADC" font-size="26">for your own agents.</text>
      <path d="M48 703H672" stroke="#D0DFEF" stroke-opacity="0.15"/>
      <text x="48" y="737" fill="#CED9E6" font-size="16">macOS · Windows · Linux</text>
      <text x="672" y="737" text-anchor="end" fill="#9CB1C6" font-size="14" letter-spacing="0.8">YOUR WORKSPACE</text>
    </g>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" x="175" y="344" width="370" height="370"><defs>
<linearGradient id="brand-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2F36"/><stop offset=".5" stop-color="#16171B"/><stop offset="1" stop-color="#08080A"/></linearGradient>
<radialGradient id="brand-w" cx=".5" cy=".5" r=".55" fx=".33" fy=".28"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F2F2F5"/><stop offset=".85" stop-color="#B9B9C2"/><stop offset="1" stop-color="#8C8C96"/></radialGradient>
<radialGradient id="brand-b" cx=".5" cy=".5" r=".55" fx=".33" fy=".28"><stop offset="0" stop-color="#8CC6FF"/><stop offset=".45" stop-color="#1E8BFF"/><stop offset=".85" stop-color="#0A5BD0"/><stop offset="1" stop-color="#063E94"/></radialGradient>
