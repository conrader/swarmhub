<radialGradient id="brand-g" cx=".5" cy=".5" r=".55" fx=".33" fy=".28"><stop offset="0" stop-color="#8BF2BF"/><stop offset=".45" stop-color="#14D07F"/><stop offset=".85" stop-color="#00A35F"/><stop offset="1" stop-color="#007443"/></radialGradient>
