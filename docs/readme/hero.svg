<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SwarmHub — your agents, all together</title>
  <desc id="description">A cream banner with the SwarmHub wordmark, a desktop workspace tagline for macOS, Windows, and Linux, and the website's round two-eye SwarmHub logo.</desc>
  <defs>
