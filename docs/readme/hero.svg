<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SwarmHub — your agents, one place to work</title>
  <desc id="description">A dark blue banner with the SwarmHub wordmark, a desktop workspace tagline for macOS, Windows, and Linux, and the project's white, blue, orange, and green SwarmHub bot marks.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1280" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1727"/>
      <stop offset="0.55" stop-color="#101C30"/>
      <stop offset="1" stop-color="#112A35"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1050 210) scale(390 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C9BBB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4C9BBB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="632" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FC6FF"/>
      <stop offset="1" stop-color="#A0EACB"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="1280" height="450" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="450" fill="url(#canvas)"/>
    <rect width="1280" height="450" fill="url(#halo)"/>
    <g stroke="#A0CFDE" stroke-opacity="0.12">
      <ellipse cx="1048" cy="223" rx="209" ry="178" transform="rotate(-22 1048 223)"/>
      <ellipse cx="1048" cy="223" rx="245" ry="209" transform="rotate(-22 1048 223)" stroke-dasharray="3 9"/>
      <path d="M832 45V357M782 221H1261" stroke-opacity="0.07"/>
    </g>
    <circle cx="863" cy="321" r="5" fill="#89D9B8"/>
    <circle cx="1218" cy="102" r="4" fill="#F2B86E"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="87" fill="#F3F6FA" font-size="28" font-weight="650" letter-spacing="-0.8">SwarmHub</text>
      <rect x="242" y="64" width="100" height="29" rx="14.5" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text x="292" y="83" text-anchor="middle" fill="#BECCDC" font-size="11" font-weight="600" letter-spacing="1.4">PROTOTYPE</text>
      <text x="68" y="203" fill="#F5F8FC" font-size="68" font-weight="650" letter-spacing="-2.6">Your agents.</text>
      <text x="68" y="282" fill="url(#accent)" font-size="68" font-weight="650" letter-spacing="-2.6">One place to work.</text>
      <text x="72" y="329" fill="#BBCADC" font-size="22">A desktop workspace for your own agents.</text>
      <path d="M72 381H1208" stroke="#D0DFEF" stroke-opacity="0.15"/>
      <circle cx="77" cy="412" r="4" fill="#8FC6FF"/>
      <text x="94" y="417" fill="#CED9E6" font-size="13" font-weight="500" letter-spacing="0.7">macOS</text>
      <circle cx="248" cy="412" r="4" fill="#A0EACB"/>
      <text x="265" y="417" fill="#CED9E6" font-size="13" font-weight="500" letter-spacing="0.7">Windows</text>
      <circle cx="382" cy="412" r="4" fill="#F2B86E"/>
      <text x="399" y="417" fill="#CED9E6" font-size="13" font-weight="500" letter-spacing="0.7">Linux</text>
      <text x="1208" y="417" text-anchor="end" fill="#9CB1C6" font-size="12" letter-spacing="1.1">YOUR AGENTS. YOUR WORKSPACE.</text>
    </g>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" x="865" y="26" width="380" height="380"><defs>
<linearGradient id="mark-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2F36"/><stop offset=".5" stop-color="#16171B"/><stop offset="1" stop-color="#08080A"/></linearGradient>
