<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="t d">
  <title id="t">One message, from the app to an agent and back</title>
  <desc id="d">A sequence: the app posts a message to the bridge, which saves it and has Herdr Core type it into the agent&#x27;s terminal. The app follows the turn on the bridge&#x27;s event stream: tool calls and the reply so far arrive from the agent&#x27;s hooks, and the finished reply is saved in the journal by the Stop hook. A message sent meanwhile steers the running agent, and Stop presses the agent&#x27;s interrupt key.</desc>
  <defs><marker id="head-send" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#ff8a61" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tail-send" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#ff8a61" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="head-back" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#a8c9a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tail-back" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#a8c9a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="head-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#80837a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tail-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#80837a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
